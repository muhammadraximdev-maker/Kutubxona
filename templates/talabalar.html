<!DOCTYPE html>
<html>
<head>
    <title>Talabalar ro'yxati</title>
</head>
<body>
    <h1>Talabalar ro'yxati</h1>
    <hr>

    <form method="get">
        <input type="text" name="search" placeholder="Ismni kiriting" {% if search %}value="{{ search }}"{% endif %}>

        <select name="sort">
            <option value="ism" {% if sort == 'ism' %}selected{% endif %}>Ism bo'yicha (A → Z)</option>
            <option value="-ism" {% if sort == '-ism' %}selected{% endif %}>Ism bo'yicha (Z → A)</option>
        </select>

        <button type="submit">Go</button>
    </form>

    <hr>
    {% for talaba in talabalar %}
    <p>
        {{ forloop.counter }}.
        <a href="{% url 'talaba_detail' talaba.id %}">
            {{ talaba.ism }}
        </a>
        <a href="/talabalar/{{ talaba.id }}/delete-confirm">
            <button>O'chirish</button>
        </a>
        <a href="/talabalar/{{ talaba.id }}/update">
            <button>Tahrirlash</button>
        </a>
    </p>
    {% empty %}
    <p>Hech qanday talaba topilmadi.</p>
    {% endfor %}

    <br>
    <a href="{% url 'home' %}">Bosh sahifaga qaytish</a>
    <hr>
    <h2>Yangi talaba</h2>
<form method="POST">
    {% csrf_token %}
    <label for="ism" >Ism:</label>
    <input type="text" name="ism" id="ism"  required><br><br>
    <label for="guruh" >Guruh:</label>
    <input type="text" name="guruh" id="guruh"  required><br><br>
    <label for="kurs" >Bosqich:</label>
    <select name="kurs" id="kurs">
        <option value="1">1-kurs</option>
        <option value="2">2-kurs</option>
        <option value="3">3-kurs</option>
        <option value="4">4-kurs</option>    </select>  <br><br>
    <label for="kitob_soni">Kitob soni:</label>
    <input type="number"name="kitob_soni" id="kitob_soni"   value="0"  >
    <button type="submit">Saqlash</button>

</form>
</body>
</html>
