<!DOCTYPE html>
<html>
<head>
    <title>Kitoblar ro'yxati</title>
</head>
<body>
    <h1>Kitoblar ro'yxati</h1>
    <hr>

    <form method="get">
        <input type="text" name="q" {% if q %} value="{{ q }}"{% endif %} placeholder="Qidiruv...">

        <select name="sort">
            <option value="nom" {% if sort == 'nom' %} selected{% endif %}>Nomi bo'yicha (a → z)</option>
            <option value="-nom" {% if sort == '-nom' %} selected{% endif %}>Nomi bo'yicha (z → a)</option>
            <option value="sahifa" {% if sort == 'sahifa' %} selected{% endif %}>Sahifa bo'yicha ↑</option>
            <option value="-sahifa" {% if sort == '-sahifa' %} selected{% endif %}>Sahifa bo'yicha ↓</option>
        </select>

        <button type="submit">Go</button>
    </form>

    <hr>

    {% for kitob in kitoblar %}
    <p>
        {{ forloop.counter }}.

        <a href="{% url 'kitob_detail' kitob.id %}">
            {{ kitob.nom }}
        </a>
        ({{ kitob.sahifa }} bet)

        <a href="{% url 'kitob_delete_confirm' kitob.id %}">
          <button>O'chirish</button>
        </a>
        <a href="/kitoblar/{{ kitob.id }}/update">
            <button>Tahrirlash</button>
        </a>
    </p>
    {% empty %}
    <p>Kitoblar topilmadi.</p>
    {% endfor %}

    <br>
    <a href="{% url 'home' %}">Bosh sahifaga qaytish</a>
    <hr>
    <h2>Yangi kitob</h2>
<form method="POST">
    {% csrf_token %}
    {{ form.as_p}}
    <button type="submit">Saqlash</button>
</form>
</body>
</html>
